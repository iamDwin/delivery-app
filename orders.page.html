<ion-header>
  <ion-toolbar>
    <ion-title>Orders</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">My Orders</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let order of orders">
    <ion-card-header>
      <ion-card-title>Order #{{ order.id }}</ion-card-title>
      <ion-card-subtitle>{{ order.date | date:'short' }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p><strong>From:</strong> {{ order.from }}</p>
      <p><strong>To:</strong> {{ order.to }}</p>
      <p><strong>Status:</strong> 
        <ion-badge color="primary">{{ order.status }}</ion-badge>
      </p>
      <p><strong>Amount:</strong> ₦{{ order.amount }}</p>
    </ion-card-content>
  </ion-card>

  <div *ngIf="orders.length === 0" class="empty-state">
    <ion-icon name="clipboard-outline"></ion-icon>
    <p>No orders yet</p>
  </div>
</ion-content>
